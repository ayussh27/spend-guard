# agent-budget-guard — model price table
#
# All token prices are USD per 1 MILLION tokens (standard tier).
# Batch APIs are usually 50% off — the estimator applies `batch_discount` when --batch is passed.
#
# tier = capability tier used by the router:
#   1 = simple   (classify, extract, format, short summaries)
#   2 = standard (most coding, writing, analysis)
#   3 = complex  (hard reasoning, architecture, long-horizon agent work)
# Tiers are a judgment call — open a PR if you disagree.
#
# CONTRIBUTING: prices change often. When you update a price, also update
# `last_verified` (YYYY-MM-DD) and `source`. Use the provider's OFFICIAL pricing
# page as the source. The estimator warns when an entry is stale.
#
# Optional fields:
#   cached_input   price for cache hits / cached input
#   long_context   higher prices that apply to the WHOLE request when the prompt
#                  has more than `above_tokens` input tokens
#   price_changes  scheduled changes, each with an `effective_from` date:
#                    price_changes:
#                      - effective_from: 2027-01-01
#                        input: 3.00
#                        output: 15.00

currency: USD
batch_discount: 0.5
stale_after_days: 45

