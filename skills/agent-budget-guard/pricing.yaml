# Unit-priced tools (image/video generation, credits, per-call APIs).
# These are TEMPLATES — set `unit_cost` to what YOUR plan actually charges.
# Entries with `example: true` are excluded from routing and flagged in output.
units:
  example-video-credits:
    unit: credit
    unit_cost: 0.05
    example: true
    note: Replace with your video tool's real cost per credit.

  example-image-generation:
    unit: image
    unit_cost: 0.04
    example: true
    note: Replace with your image tool's real cost per image.
